name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile and import checks
        run: |
          python -m compileall -q app.py api src scripts tests
          python -c "from api.main import app; from src.recommendation.engine import RecommendationEngine"
      - name: Test suite
        run: pytest -q

